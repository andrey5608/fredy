name: Create and publish Docker image

# Disabled in this fork: manual-only. Images are built locally via `docker compose build`
# rather than published to ghcr on every push.
on:
  workflow_dispatch:

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: ${{ github.repository }}
      # Reproduces the metadata-action defaults this workflow relied on before:
      # master -> :master + :latest, release tag -> :<version>
      tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=raw,value=latest,enable={{is_default_branch}}
